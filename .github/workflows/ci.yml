name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
      TEST_REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose-smoke:
    name: docker compose up · smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack exactly as documented (no .env)
        run: docker compose up -d --build --wait
      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
