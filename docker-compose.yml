# Local stack: MongoDB + API.
#   docker compose up --build      → API on http://localhost:8000 (docs at /docs)
# Works without a .env file; every variable below has a default (see .env.example).
name: viasegura

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      # Bound to localhost only: the database is never exposed to the network.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: viasegura-api:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      API_ENV: ${API_ENV:-local}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Inside compose the database is always reached through its service name.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-viasegura}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
